<!doctype html>
<html lang="ckb" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103b2d"><title>KurdAI — دروستکردنی وێنە</title>
<style>
:root{color-scheme:light;--green:#123d2e;--green2:#1b6547;--cream:#f7f8f3;--ink:#17251e;--muted:#68776e;--line:#dfe7df}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(135deg,#0d3024,#1b6547);color:#fff;padding:18px max(18px,calc((100% - 1050px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:4px solid #ffd52a}
a{color:inherit;text-decoration:none}.brand{font-size:24px;font-weight:850}.brand span{color:#ffe05b}.back{border:1px solid #ffffff66;border-radius:20px;padding:8px 13px;font-size:14px}
main{max-width:1050px;margin:auto;padding:35px 18px 60px}.hero{text-align:center;margin-bottom:26px}.hero h1{font-size:clamp(30px,5vw,46px);margin:0 0 8px}.hero p{color:var(--muted);line-height:1.8;margin:0}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.85fr);gap:20px}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 30px #183c2510}
label{display:block;font-weight:750;margin:0 0 9px}textarea{width:100%;min-height:180px;border:1px solid #d8e2d9;border-radius:13px;padding:14px;font:inherit;line-height:1.8;resize:vertical;outline:none}textarea:focus{border-color:#39845b;box-shadow:0 0 0 3px #39845b19}
.hint{color:var(--muted);font-size:13px;line-height:1.8;margin:10px 0 18px}.status{background:#edf7ef;border-radius:12px;padding:12px;margin-bottom:16px;font-size:14px;line-height:1.7}.generate{width:100%;border:0;border-radius:13px;background:linear-gradient(100deg,#1a6345,#10402e);color:white;padding:15px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}.generate:disabled{opacity:.5;cursor:not-allowed}
.preview{min-height:350px;display:flex;align-items:center;justify-content:center;background:#f3f6f2;border:1px dashed #cbd8ce;border-radius:15px;overflow:hidden}.preview img{display:block;width:100%;height:auto}.empty{text-align:center;padding:25px;color:var(--muted);line-height:1.8}.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.actions a,.actions button{border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:white;font:inherit;cursor:pointer}
#message{margin-top:14px;color:#8a3027;font-size:14px;line-height:1.7;min-height:22px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.preview{min-height:240px}header{padding-inline:16px}}
</style></head>
<body><header><a class="brand" href="/">☀ Kurd<span>AI</span></a><a class="back" href="/">گەڕانەوە بۆ KurdAI</a></header>
<main><section class="hero"><h1>دروستکەری وێنەی KurdAI</h1><p>بە دەق و خەیاڵی خۆت وێنە دروست بکە؛ کارتۆن، 3D، فوتۆگرافی، سینەماتیکی و هەر شێوازێکی دیکە.</p></section>
<div class="grid"><section class="panel"><div id="quota" class="status">پشکنینی هەژمار...</div><label for="prompt">وەسفی وێنەکە بنووسە</label><textarea id="prompt" maxlength="1200" placeholder="بۆ نموونە: شارێکی کوردی لەسەر چیایەک، بە شێوازی 3D سینەماتیکی..."></textarea><p class="hint">دەتوانیت بە کوردی، ئینگلیزی یان هەر زمانێک وەسفی وێنەکەت بنووسیت. جۆری وێنەکە سنووردار نییە.</p><button id="generate" class="generate" disabled>دروستکردنی وێنە</button><div id="message" role="status" aria-live="polite"></div></section>
<section class="panel"><div id="preview" class="preview"><div class="empty">وێنەکەت لێرە پیشان دەدرێت</div></div><div class="actions"><a id="download" hidden download="kurdai-image.jpg">داگرتنی وێنە</a><button id="new" type="button">پاککردنەوە</button></div></section></div></main>
<script src="/image.js"></script></body></html>
