<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#212121"><title>KurdAI — چات</title><link rel="stylesheet" href="/chat.css">
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="side-top"><a class="brand" href="/"><span class="flag">☀</span><b>Kurd<span>AI</span></b></a><button id="closeSidebar" class="icon-btn mobile-only" aria-label="داخستن">×</button></div>
 <button id="newChat" class="new-chat"><span>＋</span> چاتی نوێ</button>
 <div class="history-title">چاتەکانت</div><nav id="chatHistory" class="history-list" aria-label="مێژووی چات"></nav>
 <div class="side-bottom"><a href="/">↩ گەڕانەوە بۆ ستۆدیۆ</a><small>چاتی KurdAI · بەخۆڕایی</small></div>
</aside>
<div id="scrim" class="scrim"></div>
<section class="main">
 <header class="topbar"><button id="openSidebar" class="icon-btn" aria-label="مێژووی چات">☰</button><div class="top-title">KurdAI <span>Chat</span></div><div class="top-controls"><select id="language" aria-label="زمانی وەڵام"><option value="auto">زمانی خۆکار</option><option value="sorani">سۆرانی</option><option value="badini">بادینی</option><option value="english">English</option><option value="finnish">Suomi</option><option value="arabic">العربية</option><option value="turkish">Türkçe</option><option value="german">Deutsch</option><option value="russian">Русский</option><option value="persian">فارسی</option></select><select id="mode" aria-label="جۆری چات"><option value="chat">چات</option><option value="translate">وەرگێڕان</option></select><select id="targetLanguage" aria-label="زمانی وەرگێڕان" hidden><option value="sorani">بۆ سۆرانی</option><option value="badini">بۆ بادینی</option><option value="english">بۆ ئینگلیزی</option><option value="finnish">بۆ فینلەندی</option><option value="arabic">بۆ عەرەبی</option><option value="turkish">بۆ تورکی</option><option value="german">بۆ ئەڵمانی</option><option value="russian">بۆ ڕووسی</option><option value="persian">بۆ فارسی</option></select></div></header>
 <main class="conversation" id="conversation"><section id="welcome" class="welcome"><div class="welcome-mark">☀</div><h1>چۆن یارمەتیت بدەم؟</h1><p>پرسیار بکە، بیرۆکەکانت پەرە پێ بدە، یان دەق وەرگێڕە.</p><div class="suggestions"><button data-prompt="سڵاو، خۆت بناسێنە و بڵێ چۆن دەتوانیت یارمەتیم بدەیت؟">سڵاو، خۆت بناسێنە</button><button data-prompt="ئەم دەقە بۆ کوردی سۆرانی وەربگێڕە: ">وەرگێڕانی دەق</button><button data-prompt="یارمەتیم بدە پلانی ڕۆژانەیەک دابنێم.">پلانی ڕۆژانە</button></div></section><div id="messages" class="messages" aria-live="polite"></div></main>
 <footer class="composer-wrap"><form id="chatForm" class="composer"><textarea id="prompt" rows="1" maxlength="2000" placeholder="نامەیەک بۆ KurdAI بنووسە..." required></textarea><button id="send" type="submit" aria-label="ناردن">↑</button></form><div id="status" class="status" role="status" aria-live="polite">KurdAI دەتوانێت هەڵە بکات؛ زانیاریی گرنگ پشتڕاست بکەرەوە.</div></footer>
</section></div><script type="module" src="/chat.js"></script>
</body></html>
