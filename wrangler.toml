name = "kurdai"
main = "worker.js"
compatibility_date = "2026-10-10"
# Preserve runtime variables configured in the dashboard during Git deployments.
keep_vars = true

# Public staging origin only; its shared credential belongs in Worker secrets.
# Provider credentials are runtime secrets. Spending stays disabled.
[vars]
STRIPE_CHECKOUT_ENABLED = "false"
BILLABLE_REQUESTS_ENABLED = "false"
API_MAX_JOB_USD = "0"
API_MAX_DAY_USD = "0"
LONG_VIDEO_SERVICE_URL = "https://kurdai-processor-staging.onrender.com"

# Worker Previews do not inherit production bindings or secrets.
# Keep billable generation disabled until a separate test database is configured.
[previews.vars]
VIDEO_GENERATION_ENABLED = "false"
LONG_VIDEO_ENABLED = "false"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "kurdai-db"
database_id = "2fd9e61a-2bd8-434d-aa52-8d5445ea7229"
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
