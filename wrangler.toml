name = "kurdai"
main = "worker.js"
compatibility_date = "2026-10-10"
# Preserve runtime variables configured in the dashboard during Git deployments.
keep_vars = true

# Public staging origin only; its shared credential belongs in Worker secrets.
# Provider credentials are runtime secrets. Spending stays disabled.
[vars]
# Payment and API spending controls are managed in the production Dashboard.
# Missing controls remain disabled by application defaults; keep_vars preserves existing values.
LONG_VIDEO_SERVICE_URL = "https://kurdai-processor-staging.onrender.com"

# Preview configuration is independent of production. Existing preview secrets
# stay in Cloudflare; never copy their values into this file.
[previews.vars]
STRIPE_MODE = "test"
STRIPE_CHECKOUT_ENABLED = "false"
BILLABLE_REQUESTS_ENABLED = "false"
API_MAX_JOB_USD = "0"
API_MAX_DAY_USD = "0"
VIDEO_GENERATION_ENABLED = "false"
LONG_VIDEO_ENABLED = "false"
LONG_VIDEO_SERVICE_URL = "https://kurdai-processor-staging.onrender.com"

[[previews.d1_databases]]
binding = "DB"
database_name = "kurdai-test-db"
database_id = "8c01cc6c-b25a-4a48-9f6a-48ecb9cad943"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "kurdai-db"
database_id = "2fd9e61a-2bd8-434d-aa52-8d5445ea7229"
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
